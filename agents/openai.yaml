interface:
  display_name: "Taste + GSAP Frontend"
  short_description: "Design distinctive frontends with capable GSAP motion"
  default_prompt: >
    Use $taste-gsap-frontend to design and implement a distinctive marketing
    frontend. Preserve the existing stack and existing product copy. Treat task
    instructions as design context, not page content, and never derive
    user-facing copy from the brief unless copywriting is explicitly requested.
    State the motion mode and creative ambition separately. Match the requested
    level of expression; do not flatten a cinematic or high-impact brief into
    generic fades just because they are simpler. Verify API/version assumptions,
    content provenance, reduced-motion behavior, mobile fallbacks, and cleanup.
